<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Top White Glow Gradient -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Yellow Lightning Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Gear Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)" />
  <rect width="512" height="220" rx="64" fill="url(#topGlow)" />

  <!-- Background Giant Cyan Gear (Subtle Overlay) -->
  <g transform="translate(290, 270) scale(1.15)" fill="#60a5fa" opacity="0.35">
    <path d="M -30,-120 L 30,-120 L 25,-85 A 90 90 0 0 1 65,-65 L 95,-85 L 135,-45 L 115,-15 A 90 90 0 0 1 125,30 L 160,45 L 140,105 L 105,95 A 90 90 0 0 1 65,135 L 75,170 L 15,180 L 5,145 A 90 90 0 0 1 -45,140 L -65,175 L -120,150 L -105,115 A 90 90 0 0 1 -135,75 L -170,85 L -180,25 L -145,15 A 90 90 0 0 1 -140,-45 L -175,-65 L -150,-120 L -115,-105 A 90 90 0 0 1 -75,-135 Z" />
    <circle cx="0" cy="0" r="55" fill="url(#bgGrad)" />
  </g>

  <!-- Main Left Black Industrial Gear -->
  <g transform="translate(145, 275)" filter="url(#dropShadow)">
    <g fill="#111827">
      <!-- 12-tooth industrial cog -->
      <path d="
        M -22,-95 L 22,-95 L 18,-72 A 72 72 0 0 1 52,-52 L 72,-72 L 95,-45 L 75,-25 A 72 72 0 0 1 85,15 L 105,30 L 90,70 L 65,60 A 72 72 0 0 1 35,80 L 40,105 L -5,110 L -12,85 A 72 72 0 0 1 -50,75 L -65,95 L -95,70 L -80,45 A 72 72 0 0 1 -90,10 L -110,-5 L -100,-45 L -75,-40 A 72 72 0 0 1 -55,-65 L -70,-85 Z" />
      <circle cx="-5" cy="10" r="42" fill="#1e293b" />
    </g>
    
    <!-- Yellow Lightning Bolt Cutting Across Gear -->
    <polygon points="12,-115 -18,-20 8,-20 -28,85 45,-15 15,-15" fill="url(#lightningGrad)" stroke="#ca8a04" stroke-width="2" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(325, 265)">
    <!-- T&S Large Serif Display Monogram -->
    <text x="0" y="5" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="118" fill="#0f172a" letter-spacing="-2">
      T&amp;S
    </text>

    <!-- Underline Bar -->
    <rect x="-140" y="24" width="280" height="7" rx="3" fill="#0f172a" />

    <!-- Subtitle "INDUSTRIAL SERVICE" -->
    <text x="0" y="58" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="21" fill="#0f172a" letter-spacing="4">
      INDUSTRIAL SERVICE
    </text>
  </g>
</svg>
