<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Lightning Gradient -->
    <linearGradient id="gearBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff04b" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Gear Metal Gradient -->
    <linearGradient id="gearMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g transform="translate(100, 100)" filter="url(#gearShadow)">
    <!-- 12-Teeth Precision Industrial Gear -->
    <path 
      d="
        M -16,-82 L 16,-82 L 14,-65 
        A 66 66 0 0 1 45,-47 L 60,-57 L 80,-34 L 66,-21 
        A 66 66 0 0 1 73,15 L 89,26 L 79,53 L 57,47 
        A 66 66 0 0 1 31,70 L 31,90 L -2,92 L -10,71 
        A 66 66 0 0 1 -45,53 L -63,68 L -82,46 L -68,30 
        A 66 66 0 0 1 -72,-9 L -92,-17 L -86,-47 L -63,-42 
        A 66 66 0 0 1 -39,-62 L -34,-80 Z
      " 
      fill="url(#gearMetalGrad)" 
      stroke="#94a3b8" 
      stroke-width="3" 
      stroke-linejoin="round"
    />

    <!-- Inner Gear Hole Ring -->
    <circle cx="-1" cy="4" r="42" fill="none" stroke="#94a3b8" stroke-width="3" />

    <!-- Center Lightning Bolt (Cutting through Gear) -->
    <polygon 
      points="
        12,-90 
        -28,-8 
        3,-8 
        -48,92 
        52,-18 
        18,-18
      " 
      fill="url(#gearBoltGrad)" 
      stroke="#ca8a04" 
      stroke-width="2.5"
      stroke-linejoin="miter"
    />
  </g>
</svg>
